name: flowboard-e2e

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: flowboard_e2e
      POSTGRES_USER: flowboard_e2e
      POSTGRES_PASSWORD: ${E2E_POSTGRES_PASSWORD:?E2E_POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowboard_e2e -d flowboard_e2e"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: flowboard_e2e
      POSTGRES_USER: flowboard_e2e
      POSTGRES_PASSWORD: ${E2E_POSTGRES_PASSWORD:?E2E_POSTGRES_PASSWORD is required}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ${E2E_DJANGO_SECRET_KEY:?E2E_DJANGO_SECRET_KEY is required}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      JWT_SIGNING_KEY: ${E2E_JWT_SIGNING_KEY:?E2E_JWT_SIGNING_KEY is required}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${E2E_BACKEND_PORT:-18000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready/', timeout=5).read()
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  postgres_data:
